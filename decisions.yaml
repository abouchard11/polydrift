# Human decisions on cross-venue pairs, applied after every matcher refresh.
# Version-controlled on purpose: they survive a volume wipe, ship with a deploy,
# and every reversal is a diff someone can read. `polydrift pairs --approve/--reject`
# still works for ad-hoc calls; `pairs --export-decisions` dumps them into this shape.
#
# Keyed by Kalshi ticker. Add condition_id to pin a specific Polymarket market
# when one Kalshi leg could plausibly match more than one.


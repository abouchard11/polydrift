# Copy to config.yaml and edit. config.yaml is gitignored.
db_path: data/polydrift.db

poll:
  interval_s: 300          # 5 min between cycles
  backfill_on_first_seen: true

universe:
  # Volume on Polymarket is heavily gamed (bot wash volume). Liquidity is the
  # honest filter. Verified 2026-09-04: the top-volume markets are joke markets.
  min_liquidity_usd: 25000
  max_markets: 60
  require_end_date_future: true
  max_days_to_resolution: 400
  exclude_question_patterns:
    - "(?i)jesus christ"
    - "(?i)\\balien\\b"

kalshi:
  enabled: true
  max_markets: 400
  series_allowlist: []     # empty = all; combo/MVE tickers always excluded

http:
  timeout_s: 20
  max_retries: 4
  backoff_base_s: 1.0
  user_agent: "polydrift/0.1 (read-only research harness)"

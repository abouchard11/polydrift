db_path: data/polydrift.db
poll:
  interval_s: 300
  backfill_on_first_seen: true
  report_every_cycles: 72
universe:
  min_liquidity_usd: 25000
  max_markets: 60
  require_end_date_future: true
  max_days_to_resolution: 400
  exclude_question_patterns:
  - (?i)jesus christ
  - (?i)\balien\b
  max_games: 30
  game_min_liquidity_usd: 10000
kalshi:
  enabled: true
  max_markets: 400
  series_allowlist: []
  tracked_min_review_score: 0.5
http:
  timeout_s: 20
  max_retries: 4
  backoff_base_s: 1.0
  user_agent: polydrift/0.1 (read-only research harness)
  min_interval_s: 0.5
pairs:
  event_min_score: 0.25
  max_events_per_market: 3
  min_candidate_score: 0.3
  auto_ok_score: 0.75
  close_date_tolerance_days: 45
  max_candidates_per_market: 3
  max_event_fetches_per_sweep: 150
  refresh_interval_s: 21600
divergence:
  signal_threshold_pts: 0.03
  horizons_s:
  - 3600
  - 21600
  - 86400
  max_stale_s: 1800
  max_ahead_s: 1800
  fee_rate: 0.05
  reversion_lookback_s: 21600
  non_overlapping: true
